name: Release

# Push a tag like v0.2.0 (matching "version" in mod.json) to build the
# installer and the portable zip and publish them as a GitHub release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Version from tag
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          $mod = (Get-Content mod.json -Raw | ConvertFrom-Json).version
          if ($mod -ne $v) { throw "Tag $v does not match mod.json version $mod" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Tests
        run: npm test

      - name: Package the mod (modlock.exe, the mod, Play.cmd)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          npx modlock publish --to archive --out dist
          if ($LASTEXITCODE -ne 0) { throw "modlock publish failed" }

      - name: Stage files for the installer
        shell: pwsh
        run: |
          Expand-Archive "dist/doorman-trainer-$env:VERSION.zip" -DestinationPath stage-zip
          Move-Item "stage-zip/doorman-trainer-$env:VERSION" stage
          Move-Item "dist/doorman-trainer-$env:VERSION.zip" "dist/DoormanTrainer-win-Portable.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer/DoormanTrainer.iss "/DVersion=$env:VERSION" "/DSource=$PWD\stage" "/O$PWD\dist"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $notes = "docs/releases/$env:VERSION.md"
          $ghArgs = @('release', 'create', '${{ github.ref_name }}', 'dist/DoormanTrainer-win-Setup.exe', 'dist/DoormanTrainer-win-Portable.zip', '--title', "Doorman Trainer $env:VERSION")
          if (Test-Path $notes) { $ghArgs += @('--notes-file', $notes) } else { $ghArgs += '--generate-notes' }
          gh @ghArgs
